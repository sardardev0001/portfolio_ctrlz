[project]
name = "ctrlz-backend"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.17.2,<3.18",
    "djangorestframework-simplejwt>=5.5,<5.6",
    "drf-spectacular>=0.28,<0.30",
    "django-cors-headers>=4.7,<5",
    "django-storages[s3]>=1.14,<1.15",
    "psycopg[binary]>=3.2,<3.4",
    "Pillow>=11.3,<13",
    "gunicorn>=23,<24",
    "whitenoise>=6.9,<7",
    "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
    "django-stubs>=5.2,<5.3",
    "djangorestframework-stubs>=3.16,<3.17",
    "pytest-cov>=7,<8",
    "reportlab>=4.4,<6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
exclude = ["migrations"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["core", "config", "domains"]
[tool.django-stubs]
django_settings_module = "config.settings"
