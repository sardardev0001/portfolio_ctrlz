x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *bounded-logs
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
    - postgres_prod:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      retries: 20
  minio:
    profiles: [s3]
    image: ${MINIO_IMAGE:-ctrlz-minio:source-2025-10-15}
    command: server /data
    healthcheck:
      test: ["CMD-SHELL", "if command -v curl >/dev/null 2>&1; then curl -fsS http://127.0.0.1:9000/minio/health/live; else python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:9000/minio/health/live\", timeout=3)'; fi"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *bounded-logs
    mem_limit: ${MINIO_MEMORY_LIMIT:-512m}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
    - minio_prod:/data
    build:
      context: .
      dockerfile: ops/minio.Dockerfile
  minio-init:
    profiles: [s3]
    image: ctrlz-backend:${CTRLZ_RELEASE:-production}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ${CTRLZ_ENV_FILE:-.env}
    logging: *bounded-logs
    depends_on:
      minio:
        condition: service_healthy
    command:
    - python
    - -m
    - core.init_storage
  backend:
    image: ctrlz-backend:${CTRLZ_RELEASE:-production}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ${CTRLZ_ENV_FILE:-.env}
    environment:
      DEBUG: 'false'
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      SECURE_SSL_REDIRECT: 'false'
    restart: unless-stopped
    logging: *bounded-logs
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1g}
    stop_grace_period: 60s
    volumes:
    - media_prod:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
        required: false
    command:
    - sh
    - -c
    - python manage.py collectstatic --noinput && exec gunicorn
      config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-2}
      --threads ${GUNICORN_THREADS:-2}
      --timeout 3900 --graceful-timeout 45 --access-logfile -
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/',timeout=3)
      interval: 10s
      retries: 15
  frontend:
    image: ctrlz-frontend:${CTRLZ_RELEASE:-production}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      API_PROXY_TOKEN: ${API_PROXY_TOKEN}
      TRUST_PROXY_HEADERS: 'true'
    restart: unless-stopped
    logging: *bounded-logs
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-768m}
    stop_grace_period: 45s
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      retries: 15
  nginx:
    image: nginx:stable-alpine@sha256:ed84151ed2d47ef93c0939eb9b9754c6990db6092cd2081e11988a47a83d47ea
    volumes:
    - ./ops/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
    - ${CTRLZ_HTTP_BIND:-127.0.0.1:8080}:80
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
    logging: *bounded-logs
    mem_limit: 128m
volumes:
  postgres_prod: null
  minio_prod: null
  media_prod: null
