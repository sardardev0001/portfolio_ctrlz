services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: ${MINIO_IMAGE:-ctrlz-minio:source-2025-10-15}
    command: server /data --console-address :9001
    healthcheck:
      test: ["CMD-SHELL", "if command -v curl >/dev/null 2>&1; then curl -fsS http://127.0.0.1:9000/minio/health/live; else python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:9000/minio/health/live\", timeout=3)'; fi"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
    - minio_data:/data
    ports:
    - 127.0.0.1:9001:9001
    build:
      context: .
      dockerfile: ops/minio.Dockerfile
  minio-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    command:
    - python
    - -m
    - core.init_storage
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command:
    - sh
    - -c
    - python manage.py migrate && python manage.py seed && python manage.py runserver
      0.0.0.0:8000
    ports:
    - 127.0.0.1:8000:8000
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/',timeout=3)
      interval: 10s
      timeout: 5s
      retries: 15
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      API_PROXY_TOKEN: ${API_PROXY_TOKEN}
    depends_on:
      backend:
        condition: service_healthy
    ports:
    - 127.0.0.1:3000:3000
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 15
volumes:
  postgres_data: null
  minio_data: null
