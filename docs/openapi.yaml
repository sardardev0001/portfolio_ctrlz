components:
  schemas:
    Achievement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        translations:
          description: 'Locale overrides, e.g. {"en": {"title": "Title"}}'
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        visible:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        title:
          type: string
          maxLength: 160
        value:
          type: string
          maxLength: 40
        description:
          type: string
        numeric_value:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        prefix:
          type: string
          maxLength: 12
        suffix:
          type: string
          maxLength: 12
        icon:
          type: string
          maxLength: 24
      required:
      - created_at
      - id
      - title
      - updated_at
      - value
    AchievementRequest:
      type: object
      properties:
        translations:
          description: 'Locale overrides, e.g. {"en": {"title": "Title"}}'
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        visible:
          type: boolean
        title:
          type: string
          minLength: 1
          maxLength: 160
        value:
          type: string
          minLength: 1
          maxLength: 40
        description:
          type: string
        numeric_value:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        prefix:
          type: string
          maxLength: 12
        suffix:
          type: string
          maxLength: 12
        icon:
          type: string
          maxLength: 24
      required:
      - title
      - value
    AdminAuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        action:
          type: string
          maxLength: 32
        entity:
          type: string
          maxLength: 80
        entity_id:
          type: string
          maxLength: 40
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: integer
          nullable: true
      required:
      - action
      - created_at
      - entity
      - entity_id
      - id
    AnalyticsKindEnum:
      enum:
      - page
      - project
      - social
      type: string
      description: |-
        * `page` - page
        * `project` - project
        * `social` - social
    AnalyticsRequest:
      type: object
      properties:
        kind:
          allOf:
          - $ref: '#/components/schemas/AnalyticsKindEnum'
          default: page
        page:
          type: string
          minLength: 1
          maxLength: 160
        token:
          type: string
          minLength: 1
          pattern: ^[a-zA-Z0-9-]{16,64}$
      required:
      - page
      - token
    BlankEnum:
      enum:
      - ''
    Certificate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        icon_url:
          type: string
          readOnly: true
        certificate_url:
          type: string
          readOnly: true
        translations:
          description: 'Locale overrides, e.g. {"en": {"title": "Title"}}'
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        visible:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        title:
          type: string
          maxLength: 160
        issuer:
          type: string
          maxLength: 160
        year:
          type: string
          maxLength: 32
        url:
          type: string
          format: uri
          maxLength: 200
        description:
          type: string
        icon:
          type: string
          maxLength: 24
        verification_url:
          type: string
          format: uri
          maxLength: 200
        icon_asset:
          type: integer
          nullable: true
        certificate_asset:
          type: integer
          nullable: true
      required:
      - certificate_url
      - created_at
      - icon_url
      - id
      - title
      - updated_at
    CertificateRequest:
      type: object
      properties:
        translations:
          description: 'Locale overrides, e.g. {"en": {"title": "Title"}}'
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        visible:
          type: boolean
        title:
          type: string
