      - admin
      security:
      - cookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                - error
                - meta
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/PaginatedAchievementList'
                  error:
                    nullable: true
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        format: uuid
          description: ''
        '400':
          description: Versioned API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        '401':
