# Install only after auditing existing virtual hosts and port ownership.
server {
    listen 80;
    server_name ctrtlzweb.ir www.ctrtlzweb.ir;
    server_tokens off;
    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }
    location / { return 503; }
}
