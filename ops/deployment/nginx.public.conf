# Host TLS ingress. Install only once DNS and both certificate names are valid.
server {
    listen 80;
    server_name ctrtlzweb.ir www.ctrtlzweb.ir;
    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }
    location / { return 308 https://ctrtlzweb.ir$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.ctrtlzweb.ir;
    ssl_certificate /etc/letsencrypt/live/ctrtlzweb.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ctrtlzweb.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://ctrtlzweb.ir$request_uri;
}
server {
    listen 443 ssl;
    server_name ctrtlzweb.ir;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/ctrtlzweb.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ctrtlzweb.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 1025m;
    client_body_timeout 3900s;
    proxy_send_timeout 3900s;
    proxy_read_timeout 3900s;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
