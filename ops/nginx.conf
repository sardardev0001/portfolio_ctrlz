# The published port is loopback-only. A host Nginx terminates public TLS and
# overwrites these headers; direct public access to this container is forbidden.
map $http_x_forwarded_proto $ctrlz_scheme {
  default $scheme;
  https https;
}
map $http_x_real_ip $ctrlz_client_ip {
  default $http_x_real_ip;
  "" $remote_addr;
}
server {
  listen 80;
  server_name _;
  # 1 GiB per file plus 1 MiB multipart overhead; Django enforces the exact file limit.
  client_max_body_size 1025m;
  client_body_timeout 3900s;
  proxy_read_timeout 3900s;
  proxy_send_timeout 3900s;
  proxy_request_buffering off;
  error_page 413 = @upload_limit;
  location @upload_limit { default_type application/json; return 413 '{"success":false,"data":null,"error":{"code":"VIDEO_TOO_LARGE","details":null},"meta":{}}'; }
  location /static/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $ctrlz_scheme;
  }
  location / {
    proxy_pass http://frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $ctrlz_scheme;
    proxy_set_header X-Real-IP $ctrlz_client_ip;
    proxy_set_header X-Forwarded-For $ctrlz_client_ip;
  }
}
